<style>
  :root {

  body[data-rc="Berlin"]     { --rc: #1F3FA8; }
  body[data-rc="Hannover"]   { --rc: #0B6E7A; }
  body[data-rc="Düsseldorf"] { --rc: #A3341D; }
  body[data-rc="Frankfurt"]  { --rc: #5B2A86; }
  body[data-rc="Stuttgart"]  { --rc: #1E6B3A; }
  body[data-rc="München"]    { --rc: #B5651D; }
  body.has-rc {
    --bg: var(--rc);
    --ink: #FFFFFF;
    --ink-2: rgba(255, 255, 255, .74);
    --line: rgba(255, 255, 255, .28);
    --card: rgba(255, 255, 255, .14);
    --card-ink: #FFFFFF;
    --card-ink-2: rgba(255, 255, 255, .78);

    var best = null;
    for (var i = 0; i < ranges.length; i++) {
      if (ranges[i].from <= n && (!best || ranges[i].from > best.from)) best = ranges[i];
    }
    return best;
  }
  function candidates(prefix) {
    var k = prefix.length;
    var span = Math.pow(10, 5 - k);
    var lo = parseInt(prefix, 10) * span;
    var hi = lo + span - 1;
    var out = [], seen = {};
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if (r.to >= lo && r.from <= hi) {
        if (!seen[r.sales]) { seen[r.sales] = r; out.push(r); }
      }
    }
    return out;
  }

  function setRc(rc) {
    if (rc) {
      body.setAttribute('data-rc', rc);
      body.className = 'has-rc';
    } else {
      body.removeAttribute('data-rc');
      body.className = '';
    }
  }

  function miniLinks(c) {
    if (!c) return '';
    var h = '';
    if (c.tel) h += '<a class="ic" href="tel:' + esc(c.tel) + '" aria-label="Anrufen ' + esc(c.telDisplay || c.tel) + '">' + ICON_TEL + '</a>';
    if (c.mail) h += '<a class="ic" href="mailto:' + esc(c.mail) + '" aria-label="E-Mail an ' + esc(c.mail) + '">' + ICON_MAIL + '</a>';
    return h;
  }
  function personRow(role, name) {
    if (!name) return '';
    var c = contactFor(name);
    var sub = c ? (c.telDisplay ? c.telDisplay : (c.mail ? c.mail : '')) : 'keine Kontaktdaten in der Tabelle';
    return '<div class="row"><div><div class="role">' + esc(role) + '</div><div class="rname">' + esc(name) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div><div class="mini">' + miniLinks(c) + '</div></div>';
  }
  var lastKey = '';
  function animClass(key) {
    var cls = (key !== lastKey) ? ' reveal' : '';
    lastKey = key;
    return cls;
  }
  function mainCard(r, label, areaText, anim) {
    var c = contactFor(r.sales);
    var h = '<div class="card' + anim + '">';
    h += '<div class="role">' + esc(label) + '</div>';
    h += '<div class="name">' + esc(r.sales) + '</div>';
    h += '<div class="sub">Regionalcenter ' + esc(r.rc) + '</div>';
    h += '<div class="sub">' + esc(areaText) + '</div>';
    if (r.fill) h += '<div class="sub">Zuordnung geografisch ergänzt (Lücke in der Excel): ' + esc(r.fill) + '</div>';
    if (c && (c.tel || c.mail)) {
      h += '<div class="actions">';
      if (c.tel) h += '<a class="btn" href="tel:' + esc(c.tel) + '">Anrufen<small>' + esc(c.telDisplay) + '</small></a>';
      if (c.mail) h += '<a class="btn" href="mailto:' + esc(c.mail) + '">E-Mail<small>schreiben</small></a>';
      h += '</div>';
    } else {
      h += '<div class="sub">Keine Kontaktdaten in der Tabelle hinterlegt.</div>';
    }
    h += '</div>';
    return h;
  }

  function render(value) {
    var digits = value.replace(/\D/g, '').slice(0, 5);
    clearBtn.className = digits ? 'show' : '';

    if (!digits) {
      setRc(null);
      lastKey = '';
      result.innerHTML = '';
      hint.textContent = 'Das Ergebnis erscheint beim Tippen.';
      return;
    }

    if (digits.length < 5) {
      var cands = candidates(digits);
      var suffix = digits + Array(6 - digits.length).join('x');
      if (cands.length === 1) {
        var r0 = cands[0];
        setRc(r0.rc);
        hint.textContent = 'Alle PLZ ' + suffix + ' liegen bei einem Verkäufer.';
        result.innerHTML = mainCard(r0, 'Verkauf (Vorschau)', 'gilt für alle PLZ ' + suffix, animClass('p:' + r0.sales));
      } else if (cands.length === 0) {
        setRc(null);
        lastKey = '';
        hint.textContent = 'Für ' + suffix + ' ist nichts hinterlegt.';
        result.innerHTML = '';
      } else {
        setRc(null);
        lastKey = '';
        hint.textContent = cands.length + ' mögliche Verkäufer – weiter tippen.';
        var chips = '';
        for (var i = 0; i < cands.length; i++) chips += '<span class="chip">' + esc(cands[i].sales) + '</span>';
        result.innerHTML = '<div class="chips">' + chips + '</div>';
      }
      return;
    }

    var n = parseInt(digits, 10);
    var r = findExact(n);
    if (r) {
      setRc(r.rc);
      hint.textContent = 'PLZ ' + digits + ' ist zugeordnet.';
      var anim = animClass('f:' + r.sales);
      var h = mainCard(r, 'Verkauf', 'Gebiet ' + pad(r.from) + ' bis ' + pad(r.to), anim);
      h += '<div class="card' + anim + '">';
      h += personRow('Kfm. Innendienst', r.kfm);
      h += personRow('Techn. Innendienst', r.tech);
      h += '</div>';
      result.innerHTML = h;
    } else {
      setRc(null);
      hint.textContent = 'PLZ ' + digits + ' ist in der Tabelle nicht zugeordnet.';
      var fb = excelFallback(n);
      var h2 = '<div class="notice' + animClass('n:' + digits) + '"><strong>Keine Zuordnung für ' + digits + '</strong>';
      if (fb) {
        h2 += '<p>Diese PLZ liegt in einer Lücke der Tabelle. Die Excel-Formel würde hier ' + esc(fb.sales) +
          ' (Regionalcenter ' + esc(fb.rc) + ', Gebiet bis ' + pad(fb.to) + ') anzeigen – bitte Zuordnung klären.</p>';
      } else {
        h2 += '<p>Die Tabelle beginnt bei ' + pad(ranges.length ? ranges[0].from : 0) + '.</p>';
      }
      h2 += '</div>';
      result.innerHTML = h2;
    }
  }

  function buildList() {
    var groups = {}, order = [];
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if (!groups[r.sales]) { groups[r.sales] = { rc: r.rc, parts: [] }; order.push(r.sales); }
      groups[r.sales].parts.push(pad(r.from) + '–' + pad(r.to));
    }
    order.sort();
    var h = '';
    for (var j = 0; j < order.length; j++) {
      var g = groups[order[j]];
      h += '<div class="grp"><div class="grp-name">' + esc(order[j]) + '</div><div class="grp-rc">Regionalcenter ' + esc(g.rc) + '</div>' +
        '<div class="grp-ranges">' + esc(g.parts.join(', ')) + '</div></div>';
    }
    return h;
  }

  var prevValue = '';
  function insertedChars(prev, now) {
    var p = 0;
    while (p < prev.length && p < now.length && prev.charAt(p) === now.charAt(p)) p++;
    var s = 0;
    while (s < prev.length - p && s < now.length - p &&
           prev.charAt(prev.length - 1 - s) === now.charAt(now.length - 1 - s)) s++;
    return now.substring(p, now.length - s);
  }
  function onInput() {
    var raw = input.value.replace(/\D/g, '');
    var v = raw;
    if (raw.length > 5) {
      // Vorherige PLZ war komplett: die neu getippten Ziffern starten eine neue Eingabe.
      var ins = (prevValue.length === 5) ? insertedChars(prevValue, raw) : '';
      v = (ins ? ins : raw).slice(0, 5);
    }
    if (v !== input.value) input.value = v;
    prevValue = v;
    render(v);
    if (v.length === 5) {
      try { history.replaceState(null, '', '?plz=' + v); } catch (e) {}
    }
  }
  function selectAll() {
    try { input.select(); input.setSelectionRange(0, input.value.length); } catch (e) {}
  }

  input.addEventListener('input', onInput);
  input.addEventListener('focus', function () { setTimeout(selectAll, 0); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) input.blur();
  });
  clearBtn.addEventListener('click', function () {
    input.value = '';
    prevValue = '';
    render('');
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    input.focus();
  });
  listBtn.addEventListener('click', function () {
    var open = list.hasAttribute('hidden');
    if (open) {
      if (!list.innerHTML) list.innerHTML = buildList();
      list.removeAttribute('hidden');
      listBtn.textContent = 'Gebiete ausblenden';
      listBtn.setAttribute('aria-expanded', 'true');
    } else {
      list.setAttribute('hidden', '');
      listBtn.textContent = 'Alle Gebiete anzeigen';
      listBtn.setAttribute('aria-expanded', 'false');
    }
  });

  var standText = 'Datenstand laut Excel: ' + (DATA.stand || 'unbekannt') + '. ';
  standText += ranges.length + ' PLZ-Bereiche';
  if (DATA.built) standText += ', Seite erzeugt am ' + DATA.built;
  standEl.textContent = standText + '.';

  // Deep-Link: index.html?plz=71229
  var m = /[?&]plz=(\d{1,5})/.exec(location.search);
  if (m) {
    input.value = m[1];
    prevValue = m[1];
    render(m[1]);
  } else {
    input.focus();
  }

  // Offline-Fähigkeit (Messe ohne WLAN): Service Worker nur auf https/localhost, Fehler werden ignoriert.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }

  // Für Tests/Diagnose (z. B. in der Browser-Konsole: PLZ.lookup(71229))
  window.PLZ = { lookup: findExact, candidates: candidates, fallback: excelFallback, data: DATA };
})();
</script>
</body>
</html>
